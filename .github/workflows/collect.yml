# 매일 아침 자동으로 collect.py 를 실행해서 뉴스를 새로 모으는 설정입니다.
name: 뉴스 수집

on:
  schedule:
    - cron: "0 22 * * *"   # 한국 시간 매일 오전 7시 (UTC 22시)
  workflow_dispatch:        # Actions 화면에서 직접 실행 버튼도 쓸 수 있게

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: 수집 결과 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news-data.js
          git diff --cached --quiet || git commit -m "뉴스 수집 $(date +'%Y-%m-%d')"
          git push
