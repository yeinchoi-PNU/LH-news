<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LH 취업 이슈노트</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2228; --sub: #67707a;
    --line: #e3e6ea; --accent: #0b6e4f; --accent-soft: #e3f2ec; --star: #e0a100;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181c; --card: #1e2227; --text: #e8eaed; --sub: #9aa3ad;
      --line: #30353c; --accent: #4cc39a; --accent-soft: #1d3a30; --star: #f2c94c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; line-height: 1.5;
  }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 20px 16px 0; }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; }
  .updated { color: var(--sub); font-size: 13px; margin: 4px 0 14px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .tab {
    border: 0; background: none; color: var(--sub); font: inherit; font-size: 14px;
    padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
  }
  .tab.on { color: var(--accent); border-color: var(--accent); font-weight: 700; }
  .tab small { opacity: .7; }
  main { padding: 16px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tools input, .tools select, .tools button {
    font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .tools input { flex: 1; min-width: 160px; }
  .tools button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .box h2 { font-size: 15px; margin: 0 0 10px; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .word {
    border: 0; font: inherit; font-size: 13px; cursor: pointer;
    background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 10px;
  }
  .day { font-size: 13px; color: var(--sub); font-weight: 700; margin: 18px 0 6px; }
  .item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .star { border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--line); padding: 0 2px; line-height: 1.2; }
  .star.on { color: var(--star); }
  .body { flex: 1; min-width: 0; }
  .body a { color: var(--text); text-decoration: none; font-weight: 600; }
  .body a:hover { text-decoration: underline; }
  .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .cat { color: var(--accent); }
  .memo {
    width: 100%; margin-top: 6px; font: inherit; font-size: 13px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); resize: vertical;
  }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 10px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>LH 취업 이슈노트</h1>
    <div class="updated" id="updated"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <input id="search" type="search" placeholder="제목 검색 (예: 전세사기, 3기 신도시)">
    <select id="period">
      <option value="1">오늘</option>
      <option value="7" selected>최근 7일</option>
      <option value="30">최근 30일</option>
    </select>
    <button id="onlyStar">★ 스크랩만</button>
  </div>

  <section class="box">
    <h2>이 기간에 많이 나온 단어 <span class="meta">누르면 검색됩니다</span></h2>
    <div class="words" id="words"></div>
  </section>

  <section class="list" id="list"></section>
</main>

<!-- collect.py 가 만든 기사 데이터 -->
<script src="news-data.js"></script>
<script>
  const data = window.NEWS_DATA || { updated: "-", categories: [], articles: [] };
  const state = { cat: "전체", q: "", days: 7, onlyStar: false };

  // 스크랩(★)과 메모는 이 브라우저에만 저장됩니다.
  function load(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }
  const stars = load("lh-stars");
  const memos = load("lh-memos");

  // 단어 집계에서 뺄 흔한 단어들
  const STOP = new Set(["위해","대한","관련","통해","추진","개최","실시","진행","지역","올해","내년","기자","오늘",
    "있는","없는","이번","최대","가장","대해","한다","했다","나선다","속도","확대","지원","사업","발표","공급"]);

  function fmtDay(d) {
    const dt = new Date(d.slice(0, 10) + "T00:00:00");
    return `${dt.getMonth() + 1}월 ${dt.getDate()}일 (${"일월화수목금토"[dt.getDay()]})`;
  }

  function filtered() {
    const now = new Date();
    const from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (state.days - 1));
    const fromStr = from.toISOString().slice(0, 10);
    return data.articles.filter(a =>
      a.date.slice(0, 10) >= fromStr &&
      (state.cat === "전체" || a.category === state.cat) &&
      (!state.q || a.title.includes(state.q)) &&
      (!state.onlyStar || stars[a.link])
    );
  }

  function renderTabs(list) {
    const counts = {};
    list.forEach(a => counts[a.category] = (counts[a.category] || 0) + 1);
    const cats = ["전체", ...data.categories];
    document.getElementById("tabs").innerHTML = cats.map(c => {
      const n = c === "전체" ? list.length : (counts[c] || 0);
      return `<button class="tab ${c === state.cat ? "on" : ""}" data-cat="${c}">${c} <small>${n}</small></button>`;
    }).join("");
  }

  function renderWords(list) {
    const count = {};
    list.forEach(a => {
      const words = new Set((a.title.match(/[가-힣A-Za-z0-9]{2,}/g) || [])
        .map(w => w.replace(/(은|는|이|가|을|를|의|에|에서|로|으로|와|과|도|만)$/, "")));
      words.forEach(w => { if (w.length >= 2 && !STOP.has(w)) count[w] = (count[w] || 0) + 1; });
    });
    const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 24);
    document.getElementById("words").innerHTML = top.length
      ? top.map(([w, n]) => `<button class="word" data-word="${w}">${w} ${n}</button>`).join("")
      : `<span class="meta">기사가 없습니다</span>`;
  }

  function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

  function renderList(list) {
    if (!list.length) {
      document.getElementById("list").innerHTML = `<div class="empty">조건에 맞는 기사가 없습니다.</div>`;
      return;
    }
    let html = "", lastDay = "";
    list.forEach(a => {
      const day = a.date.slice(0, 10);
      if (day !== lastDay) { html += `<div class="day">${fmtDay(day)}</div>`; lastDay = day; }
      const on = stars[a.link];
      html += `<div class="item">
        <button class="star ${on ? "on" : ""}" data-star="${esc(a.link)}" title="스크랩">★</button>
        <div class="body">
          <a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a>
          <div class="meta"><span class="cat">${a.category}</span> · ${esc(a.source)} · ${a.date.slice(11)}</div>
          ${on ? `<textarea class="memo" data-memo="${esc(a.link)}" rows="2" placeholder="면접에서 쓸 내 생각, LH와의 연관성 메모">${esc(memos[a.link] || "")}</textarea>` : ""}
        </div>
      </div>`;
    });
    document.getElementById("list").innerHTML = html;
  }

  function render() {
    // 탭 숫자는 분야 필터를 빼고 계산
    const cat = state.cat; state.cat = "전체";
    const all = filtered(); state.cat = cat;
    const list = filtered();
    renderTabs(all);
    renderWords(list);
    renderList(list);
    document.getElementById("onlyStar").classList.toggle("on", state.onlyStar);
  }

  document.getElementById("updated").textContent =
    `마지막 수집: ${data.updated} · 보관 기사 ${data.articles.length}건`;
  document.getElementById("tabs").onclick = e => {
    const b = e.target.closest("[data-cat]"); if (b) { state.cat = b.dataset.cat; render(); }
  };
  document.getElementById("search").oninput = e => { state.q = e.target.value.trim(); render(); };
  document.getElementById("period").onchange = e => { state.days = +e.target.value; render(); };
  document.getElementById("onlyStar").onclick = () => { state.onlyStar = !state.onlyStar; render(); };
  document.getElementById("words").onclick = e => {
    const b = e.target.closest("[data-word]"); if (!b) return;
    document.getElementById("search").value = b.dataset.word; state.q = b.dataset.word; render();
  };
  document.getElementById("list").onclick = e => {
    const b = e.target.closest("[data-star]"); if (!b) return;
    const k = b.dataset.star;
    if (stars[k]) delete stars[k]; else stars[k] = true;
    save("lh-stars", stars); render();
  };
  document.getElementById("list").oninput = e => {
    const t = e.target.closest("[data-memo]"); if (!t) return;
    memos[t.dataset.memo] = t.value; save("lh-memos", memos);
  };

  render();
</script>
</body>
</html>
